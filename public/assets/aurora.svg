<svg width="1440" height="700" viewBox="0 0 1440 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Diagonal Ribbon Gradients (Violet at left Card 1 -> Luminous White/Cyan in gap -> Emerald at right Card 2) -->
    <linearGradient id="diagCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="12%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="88%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="diagGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>

    <!-- Refined Optical Glow Filters -->
    <filter id="glow-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
    <filter id="glow-crisp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Depth Vignette centered at the card gap -->
  <ellipse cx="720" cy="360" rx="260" ry="160" fill="#6366f1" opacity="0.07" filter="url(#glow-ambient)"/>
  <ellipse cx="1100" cy="440" rx="220" ry="140" fill="#06b6d4" opacity="0.05" filter="url(#glow-ambient)"/>

  <g>
    <!-- Primary Diagonal Filament: Traverses diagonally behind Card 1, through the center gap, and behind Card 2 -->
    <!-- Ambient Mist -->
    <path d="M 60 110 C 260 170, 500 280, 720 360 C 940 440, 1180 490, 1380 550"
          stroke="url(#diagGlow)" stroke-width="32" stroke-linecap="round" filter="url(#glow-ambient)"/>
    <!-- Crisp Halo -->
    <path d="M 60 110 C 260 170, 500 280, 720 360 C 940 440, 1180 490, 1380 550"
          stroke="url(#diagCore)" stroke-width="6.5" stroke-linecap="round" filter="url(#glow-crisp)"/>
    <!-- Ultra-thin 1.2px Core Filament -->
    <path d="M 60 110 C 260 170, 500 280, 720 360 C 940 440, 1180 490, 1380 550"
          stroke="url(#diagCore)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Subtle Secondary Echo Strand (slightly offset, higher curvature for high-end depth) -->
    <path d="M 100 85 C 300 150, 520 255, 720 345 C 920 425, 1140 470, 1340 525"
          stroke="url(#diagCore)" stroke-width="0.75" opacity="0.45" stroke-linecap="round"/>
  </g>
</svg>