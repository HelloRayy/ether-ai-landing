<svg width="1440" height="1500" viewBox="0 0 1440 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fluid Color Gradient: Deep violet/lavender over card top -> Bright White/Cyan wrapping around right edge -> Emerald cascading down -->
    <linearGradient id="orbitalCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="8%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="22%" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.75"/>
      <stop offset="88%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbitalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="15%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>

    <!-- Optical Glow Filters -->
    <filter id="glow-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
    <filter id="glow-crisp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Depth Vignettes -->
  <circle cx="1260" cy="220" r="260" fill="#6366f1" opacity="0.06" filter="url(#glow-ambient)"/>
  <circle cx="1340" cy="750" r="260" fill="#06b6d4" opacity="0.05" filter="url(#glow-ambient)"/>

  <g>
    <!-- Orbital Ribbon: Arcs over Card 2, wraps along its right edge, sweeps under its bottom, and cascades down the statistics -->
    <!-- Ambient Mist -->
    <path d="M 740 100 C 900 60, 1120 60, 1260 110 C 1350 150, 1380 230, 1380 330 C 1380 430, 1340 500, 1240 530 C 1160 550, 1100 580, 1120 660 C 1140 730, 1220 790, 1290 850 C 1360 920, 1390 1020, 1380 1140 C 1360 1260, 1290 1370, 1180 1440"
          stroke="url(#orbitalGlow)" stroke-width="32" stroke-linecap="round" filter="url(#glow-ambient)"/>
    <!-- Halo -->
    <path d="M 740 100 C 900 60, 1120 60, 1260 110 C 1350 150, 1380 230, 1380 330 C 1380 430, 1340 500, 1240 530 C 1160 550, 1100 580, 1120 660 C 1140 730, 1220 790, 1290 850 C 1360 920, 1390 1020, 1380 1140 C 1360 1260, 1290 1370, 1180 1440"
          stroke="url(#orbitalCore)" stroke-width="7" stroke-linecap="round" filter="url(#glow-crisp)"/>
    <!-- Ultra-thin 1.25px Core Filament -->
    <path d="M 740 100 C 900 60, 1120 60, 1260 110 C 1350 150, 1380 230, 1380 330 C 1380 430, 1340 500, 1240 530 C 1160 550, 1100 580, 1120 660 C 1140 730, 1220 790, 1290 850 C 1360 920, 1390 1020, 1380 1140 C 1360 1260, 1290 1370, 1180 1440"
          stroke="url(#orbitalCore)" stroke-width="1.25" stroke-linecap="round"/>
  </g>
</svg>